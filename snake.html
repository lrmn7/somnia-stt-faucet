<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klaim Token Snake</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column; /* Untuk menata container dan info jaringan */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1e1e1e; /* Dark body background */
            color: #cccccc; /* Default light gray text for dark mode */
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #2d2d2d; /* Darker container background */
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px; /* Increased max-width slightly */
            width: 100%;
            border-top: 5px solid #FF8C00; /* Orange accent */
            margin-bottom: 20px; /* Space for network info */
        }

        h2 {
            color: #FF8C00; /* Orange */
            margin-bottom: 15px; /* Adjusted margin */
            font-size: 1.8em;
            font-weight: 600;
        }

        .info-text {
            color: #aaaaaa; /* Gray text */
            font-size: 1em;
            margin-bottom: 25px;
        }

        .info-text strong {
            color: #FF8C00; /* Orange for emphasis */
        }

        input[type="hidden"] { /* Styling for hidden input is not visible, but good for consistency if type changes */
            /* No visual styling needed for hidden inputs */
        }

        button {
            background-color: #FF8C00; /* Orange */
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #e67e00; /* Darker orange on hover */
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .network-info {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
            color: #aaaaaa; /* Gray text */
        }

        .network-info h3 {
            color: #FF8C00; /* Orange */
            margin-top: 0;
            margin-bottom: 10px;
        }

        .network-info p {
            margin: 5px 0;
            font-size: 0.95em;
        }

        .network-info a {
            color: #FF8C00; /* Orange for links */
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .network-info a:hover {
            color: #e67e00; /* Darker orange on hover */
            text-decoration: underline;
        }

        /* Popup Styles */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Darker overlay */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: #2d2d2d; /* Dark popup background */
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            max-width: 380px; /* Adjusted width */
            width: 90%;
            position: relative;
            color: #cccccc; /* Light gray text in popup */
        }

        .popup-content h3 {
            color: #FF8C00; /* Orange */
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .popup-content p {
            font-size: 1.1em;
            color: #aaaaaa; /* Gray text in popup */
            word-wrap: break-word;
        }
        .popup-content p a {
            color: #FF8C00;
            text-decoration: underline;
        }
         .popup-content p a:hover {
            color: #e67e00;
        }


        .popup-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #aaaaaa; /* Lighter close button for dark mode */
            transition: color 0.2s ease;
        }

        .popup-close:hover {
            color: #FF8C00; /* Orange on hover */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Klaim Token Snake</h2>
        <p class="info-text">Anda akan mengklaim <strong>3500 SNK</strong> token.</p>
        <input type="hidden" id="amount" value="3500000000000000000000">
        <button onclick="claimToken()">KLAIM 3500 SNK</button>
    </div>

    <div class="network-info">
        <h3>Informasi Jaringan</h3>
        <p>Pastikan MetaMask Anda terhubung ke jaringan yang benar:</p>
        <p><strong>Nama Jaringan:</strong> Somnia Testnet</p>
        <p><strong>RPC URL:</strong> https://dream-rpc.somnia.network</p>
        <p><strong>Chain ID:</strong> 50312</p>
        <p><strong>Simbol:</strong> STT</p>
        <p>
            <a href="https://shannon-explorer.somnia.network/" target="_blank" rel="noopener noreferrer">
                Lihat di Block Explorer (Shannon)
            </a>
        </p>
    </div>

    <div id="statusPopup" class="popup-overlay">
        <div class="popup-content">
            <span class="popup-close" onclick="hidePopup()">&times;</span>
            <h3>Status Klaim</h3>
            <p id="popupMessage"></p>
        </div>
    </div>

    <script>
        const CONTRACT_ADDRESS = "0x5Cb442D8A3D7A7153BE93202e232919bE3C84C5A";
        // Nilai ini adalah 3500 SNK dengan 18 desimal, sudah dalam satuan terkecil (wei)
        const DEFAULT_CLAIM_AMOUNT_WEI = "3500000000000000000000";
        const TARGET_CHAIN_ID = 50312; // Somnia Testnet Chain ID
        const BLOCK_EXPLORER_URL = "https://shannon-explorer.somnia.network/tx/";

        const ABI = [
            "function claim(address receiver, uint256 quantity, address currency, uint256 pricePerToken, tuple(bytes32[] proof, uint256 quantityLimitPerWallet, uint256 pricePerToken, address currency) allowlistProof, bytes data)"
        ];

        function showPopup(message, isError = false, txHash = null) {
            const popup = document.getElementById("statusPopup");
            const popupMessage = document.getElementById("popupMessage");

            let displayMessage = message;
            if (txHash) {
                const explorerLink = `${BLOCK_EXPLORER_URL}${ethers.utils ? ethers.utils.hexlify(txHash) : txHash}`; // ethers.utils.hexlify for older versions if needed, directly for v6
                displayMessage = `${message}<br><a href="${explorerLink}" target="_blank" rel="noopener noreferrer">Lihat Transaksi</a>`;
            }

            popupMessage.innerHTML = displayMessage; // Use innerHTML to render the link
            popupMessage.style.color = isError ? '#FF6B6B' : '#76D7C4'; // Softer red for error, teal for success
            popup.style.display = "flex";
        }

        function hidePopup() {
            document.getElementById("statusPopup").style.display = "none";
        }

        async function checkAndSwitchNetwork() {
            if (!window.ethereum) {
                showPopup("MetaMask tidak terdeteksi. Silakan install MetaMask.", true);
                return false;
            }

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const network = await provider.getNetwork();

                if (network.chainId !== BigInt(TARGET_CHAIN_ID)) {
                    showPopup(`Anda tidak berada di jaringan Somnia Testnet (Chain ID: ${TARGET_CHAIN_ID}). Silakan ganti jaringan di MetaMask.`, true);
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: ethers.toBeHex(TARGET_CHAIN_ID) }], // ethers.toBeHex for chainId
                        });
                        // Re-check after attempting switch
                        const newNetwork = await provider.getNetwork();
                        if (newNetwork.chainId === BigInt(TARGET_CHAIN_ID)) {
                            showPopup("Berhasil berganti ke jaringan Somnia Testnet. Silakan coba klaim lagi.");
                            return true; // Successfully switched
                        } else {
                            showPopup("Gagal berganti jaringan secara otomatis. Silakan ganti jaringan secara manual di MetaMask.", true);
                            return false; // Failed to switch
                        }
                    } catch (switchError) {
                        // Handle error if the chain is not added to MetaMask yet
                        if (switchError.code === 4902) {
                            showPopup("Jaringan Somnia Testnet belum ditambahkan ke MetaMask Anda. Silakan tambahkan secara manual.", true);
                            // Anda bisa menambahkan kode untuk 'wallet_addEthereumChain' di sini jika diinginkan
                            // await window.ethereum.request({
                            // method: 'wallet_addEthereumChain',
                            // params: [{
                            // chainId: ethers.toBeHex(TARGET_CHAIN_ID),
                            // chainName: 'Somnia Testnet',
                            // nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 }, // Sesuaikan jika perlu
                            // rpcUrls: ['https://dream-rpc.somnia.network'],
                            // blockExplorerUrls: ['https://shannon-explorer.somnia.network']
                            // }],
                            // });
                        } else {
                            console.error("Error switching network:", switchError);
                            showPopup("Gagal berganti jaringan. Silakan periksa konsol untuk detail atau ganti jaringan secara manual.", true);
                        }
                        return false;
                    }
                }
                return true; // Already on the correct network
            } catch (error) {
                console.error("Error checking network:", error);
                showPopup("Terjadi kesalahan saat memeriksa jaringan: " + (error?.message || "Kesalahan tidak diketahui"), true);
                return false;
            }
        }


        async function claimToken() {
            hidePopup(); // Hide any previous popups

            if (!await checkAndSwitchNetwork()) {
                return; // Stop if not on the correct network or MetaMask not found
            }

            // Ambil nilai yang sudah dalam format wei dari input yang tersembunyi
            const amountInWeiString = document.getElementById("amount").value;

            try {
                showPopup("Menghubungkan ke MetaMask...");
                const provider = new ethers.BrowserProvider(window.ethereum);

                // Meminta izin akun jika belum terhubung
                await provider.send("eth_requestAccounts", []);

                const signer = await provider.getSigner();
                const address = await signer.getAddress();

                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

                const receiver = address;
                // --- PERBAIKAN UTAMA ADA DI SINI ---
                // Langsung konversi string amountInWeiString (yang sudah dalam wei) ke BigInt
                const quantity = BigInt(amountInWeiString);
                // --- BATAS PERBAIKAN ---

                const currency = "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"; // Native token (ETH on Somnia)
                const pricePerToken = BigInt(0); // Gunakan BigInt(0) untuk uint256
                const allowlistProof = {
                    proof: [],
                    quantityLimitPerWallet: BigInt(0), // Gunakan BigInt(0) untuk uint256
                    pricePerToken: BigInt(0),          // Gunakan BigInt(0) untuk uint256
                    currency: "0x0000000000000000000000000000000000000000"
                };
                const data = "0x";

                showPopup("Mengirim transaksi...");
                const tx = await contract.claim(receiver, quantity, currency, pricePerToken, allowlistProof, data);
                showPopup(`Transaksi dikirim. Menunggu konfirmasi...`, false, tx.hash);

                const receipt = await tx.wait();
                if (receipt.status === 1) { // Status 1 berarti sukses
                    showPopup(`✅ Klaim Berhasil! Sejumlah 3500 SNK telah diklaim.`, false, receipt.hash);
                } else { // Status 0 berarti gagal
                    showPopup(`❌ Transaksi Gagal. Status: ${receipt.status}`, true, receipt.hash);
                }

            } catch (err) {
                console.error(err);
                let errorMessage = "Terjadi kesalahan";
                if (err.code === "ACTION_REJECTED") { // Kode untuk penolakan oleh pengguna di MetaMask
                    errorMessage = "Transaksi dibatalkan oleh pengguna.";
                } else if (err.reason) { // Pesan error dari smart contract (revert)
                    errorMessage = err.reason;
                } else if (err.message) { // Pesan error umum
                    errorMessage = err.message;
                }
                 // Check for insufficient funds error (common in EVM errors)
                if (typeof err.message === 'string' && (err.message.toLowerCase().includes("insufficient funds") || err.message.toLowerCase().includes("gas required exceeds allowance"))) {
                    errorMessage = "Dana tidak mencukupi untuk membayar gas fee. Pastikan Anda memiliki cukup ETH (atau mata uang asli Somnia Testnet) di wallet Anda.";
                }

                showPopup(`❌ ${errorMessage}`, true, err.hash || null); // Sertakan hash jika ada, bahkan pada error
            }
        }

        // Close popup with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                hidePopup();
            }
        });

        // Set nilai default input tersembunyi menggunakan konstanta
        document.getElementById("amount").value = DEFAULT_CLAIM_AMOUNT_WEI;
    </script>
</body>
</html>
